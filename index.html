const areas=["Português","Conhecimentos Específicos","Políticas de Saúde Pública"];const targets=[10,30,10];const KEY="concurso-prep-v1";let state;try{state=JSON.parse(localStorage.getItem(KEY))||{}}catch{state={}};state.answers??={};state.currentChoices??={};state.favorites??=[];state.history??=[];state.flashIndex??=0;state.bankIndex??=0;let tab="home",filter="Todas",mode="bank",exam=null,flashFlipped=false,bankSelection={};
const app=document.getElementById("app"),nav=document.getElementById("nav");function save(){localStorage.setItem(KEY,JSON.stringify(state))}function pct(a,b){return b?Math.round(a/b*100):0}function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function btn(label,fn,cl="secondary"){return '<button class="'+cl+'" onclick="'+fn+'">'+label+'</button>'}function change(t){if(tab==="bank"&&t!=="bank")bankSelection={};tab=t;render()}function render(){nav.innerHTML=[["home","Início"],["bank","Questões"],["exam","Simulados"],["flash","Flashcards"],["stats","Estatísticas"],["review","Revisão"]].map(([id,n])=>btn(n,"change('"+id+"')",tab===id?"primary":"")).join("");if(tab==="home")home();if(tab==="bank")bank();if(tab==="exam")examPage();if(tab==="flash")flash();if(tab==="stats")stats();if(tab==="review")review()}

function question(q,context){if(!q)return '<div class="card">Nenhuma questão encontrada.</div>';const answer=context==="exam"?exam.answers[q.id]:bankSelection[q.id];const show=context!=="exam"&&answer!==undefined;return '<div class="card"><div class="row space"><span class="pill">'+esc(q.area)+'</span><div class="row"><small class="muted">'+esc(q.topic)+' · '+esc(q.origin)+'</small>'+(context==='bank'?btn(state.favorites.includes(q.id)?'★':'☆',"favorite('"+q.id+"')"):'')+'</div></div><p class="question">'+esc(q.text)+'</p>'+q.options.map((o,j)=>'<button class="option '+(show&&j===q.answer?"correct":"")+' '+(show&&j===answer&&j!==q.answer?"wrong":"")+' '+(answer===j?"chosen":"")+'" '+''+' onclick="choose(\''+q.id+'\','+j+',\''+context+'\')">'+String.fromCharCode(65+j)+') '+esc(o)+'</button>').join("")+(show?'<div class="note"><b>'+(answer===q.answer?'✓ Correto':'✕ Incorreto')+'</b><p>'+esc(q.explanation)+'</p><small>Gabarito: '+String.fromCharCode(65+q.answer)+'</small></div>':'')+'</div>'}
function choose(id,j,context){if(context==="exam"){exam.answers[id]=j;examPage();return}if(state.answers[id]===undefined)state.answers[id]=j;bankSelection[id]=j;save();if(context==='bank')bank();else render()}function moveBank(n){bankSelection={};const arr=list();state.bankIndex=Math.max(0,Math.min(arr.length-1,state.bankIndex+n));save();bank()}function favorite(id){state.favorites=state.favorites.includes(id)?state.favorites.filter(x=>x!==id):[...state.favorites,id];save();render()}
function buildExam(){if(areas.some((a,i)=>Q.filter(q=>q.area===a).length<targets[i])){alert("O simulado completo será liberado quando houver 50 questões distintas nas proporções do edital.");return}const chosen=[];areas.forEach((a,i)=>{const pool=Q.filter(q=>q.area===a).sort(()=>Math.random()-.5);for(let j=0;j<targets[i];j++)chosen.push(pool[j].id)});exam={ids:chosen,answers:{},index:0,end:Date.now()+10800000};examPage()}function examPage(){if(!exam){app.innerHTML='<div class="card"><h2>Simulado completo</h2><p>50 questões · 3 horas · 2 pontos por acerto · mínimo de 60 pontos.</p><p class="warn">O simulado seleciona 50 questões distintas nas proporções da prova.</p>'+btn("Iniciar simulado", "buildExam()", "primary")+'</div>';return}if(Date.now()>=exam.end){finishExam();return}const q=Q.find(x=>x.id===exam.ids[exam.index]);const rem=Math.max(0,exam.end-Date.now());const hh=String(Math.floor(rem/3600000)).padStart(2,"0"),mm=String(Math.floor(rem/60000)%60).padStart(2,"0"),ss=String(Math.floor(rem/1000)%60).padStart(2,"0");app.innerHTML='<div class="card"><div class="row space"><b>Questão '+(exam.index+1)+' de 50</b><b id="clock">'+hh+':'+mm+':'+ss+'</b></div><p class="muted">'+Object.keys(exam.answers).length+' respostas registradas</p></div>'+question(q,"exam")+'<div class="row">'+btn("← Anterior","examMove(-1)")+btn("Próxima →","examMove(1)","primary")+btn("Finalizar simulado","finishExam()")+'</div>';clearInterval(window.clockTimer);window.clockTimer=setInterval(()=>{if(tab!=="exam"||!exam){clearInterval(window.clockTimer);return}const d=exam.end-Date.now();if(d<=0){clearInterval(window.clockTimer);finishExam();return}const el=document.getElementById("clock");if(el)el.textContent=[Math.floor(d/3600000),Math.floor(d/60000)%60,Math.floor(d/1000)%60].map(x=>String(x).padStart(2,"0")).join(":")},1000)}function examMove(n){exam.index=Math.max(0,Math.min(49,exam.index+n));examPage()}function finishExam(){if(!exam)return;const score=exam.ids.reduce((sum,id)=>sum+(exam.answers[id]===Q.find(q=>q.id===id).answer?2:0),0);state.history.unshift({date:new Date().toLocaleString("pt-BR"),score,answered:Object.keys(exam.answers).length,byArea:areas.map(a=>{const ids=exam.ids.filter(id=>Q.find(q=>q.id===id).area===a);return ids.filter(id=>exam.answers[id]===Q.find(q=>q.id===id).answer).length})});save();exam=null;clearInterval(window.clockTimer);app.innerHTML='<div class="card"><h2>Resultado do simulado</h2><h1>'+score+' / 100 pontos</h1><p>'+(score>=60?'Meta de 60 pontos atingida':'Abaixo da meta de 60 pontos')+'</p>'+btn("Ver estatísticas","change('stats')","primary")+'</div>'}
function flash(){const q=Q[state.flashIndex%Q.length];app.innerHTML='<div class="card"><h2>Flashcards</h2><p class="muted">Cartão '+(state.flashIndex+1)+' de '+Q.length+' · '+esc(q.area)+'</p><div class="card" style="min-height:180px;background:#eaf5f3"><p class="question">'+(flashFlipped?esc(q.options[q.answer])+' — '+esc(q.explanation):esc(q.text))+'</p></div><div class="row">'+btn(flashFlipped?"Mostrar frente":"Virar cartão","flashFlipped=!flashFlipped;flash()","primary")+btn("←","moveFlash(-1)")+btn("→","moveFlash(1)")+'</div></div>'}function moveFlash(n){state.flashIndex=(state.flashIndex+n+Q.length)%Q.length;flashFlipped=false;save();flash()}
function deleteExam(i){if(!confirm("Excluir este simulado do histórico? Esta ação não apaga as respostas do banco."))return;state.history.splice(i,1);save();stats()}
function stats(){const bankDone=Q.filter(q=>state.answers[q.id]!==undefined),bankRight=bankDone.filter(q=>state.answers[q.id]===q.answer).length;const simDone=state.history.reduce((n,h)=>n+(h.answered||0),0),simRight=state.history.reduce((n,h)=>n+(h.byArea||[]).reduce((x,y)=>x+y,0),0);const total=bankDone.length+simDone,correct=bankRight+simRight;app.innerHTML='<div class="card"><h2>Resumo do desempenho</h2><div class="grid"><div class="metric"><b>'+bankDone.length+'</b>questões únicas no banco</div><div class="metric"><b>'+simDone+'</b>respostas em simulados</div><div class="metric"><b>'+pct(correct,total)+'%</b>acertos combinados</div><div class="metric"><b>'+state.history.length+'</b>simulados concluídos</div></div><p class="muted">Banco: '+bankRight+' acertos em '+bankDone.length+' questões · Simulados: '+simRight+' acertos em '+simDone+' respostas. As mesmas questões podem aparecer nos dois modos; o total combinado representa tentativas, não questões únicas.</p></div><div class="card"><h2>Desempenho por disciplina</h2><p class="muted">Primeiras tentativas no banco de questões</p>'+areas.map(a=>{const qs=Q.filter(q=>q.area===a),done=qs.filter(q=>state.answers[q.id]!==undefined),right=done.filter(q=>state.answers[q.id]===q.answer).length;return '<div style="margin:22px 0"><div class="row space"><b>'+a+'</b><b>'+pct(right,done.length)+'%</b></div><div class="bar"><div style="width:'+pct(right,done.length)+'%"></div></div><small class="muted">'+right+' acertos em '+done.length+' respondidas · '+qs.length+' disponíveis</small></div>'}).join("")+'</div><div class="card"><h2>Histórico de simulados</h2>'+(state.history.length?state.history.map((h,i)=>'<div class="metric" style="margin:10px 0"><div class="row space"><div><b>'+esc(h.date)+'</b> — <b>'+h.score+'/100</b><p class="muted">Português '+(h.byArea?.[0]??0)+'/10 · Nutrição '+(h.byArea?.[1]??0)+'/30 · Políticas '+(h.byArea?.[2]??0)+'/10 · '+(h.answered||0)+' respondidas</p></div>'+btn("🗑 Excluir","deleteExam("+i+")")+'</div></div>').join(""):'<p class="muted">Nenhum simulado concluído.</p>')+'</div>'}
function review(){const wrong=Q.filter(q=>state.answers[q.id]!==undefined&&state.answers[q.id]!==q.answer),fav=Q.filter(q=>state.favorites.includes(q.id));app.innerHTML='<div class="card"><h2>Revisão</h2><p class="muted">Questões erradas ('+wrong.length+') e favoritas ('+fav.length+')</p>'+[["Erradas",wrong],["Favoritas",fav]].map(([label,arr])=>'<h3>'+label+'</h3>'+(arr.length?arr.map(q=>'<div class="metric" style="margin:8px 0"><b style="font-size:14px">'+esc(q.text)+'</b><p>'+esc(q.explanation)+'</p></div>').join(""):'<p class="muted">Nenhuma questão ainda.</p>')).join("")+'</div>'}
render();</script><!-- build 0.1.2 answer-change fix --></body></html>
