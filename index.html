<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10283b"><title>Concurso Prep • Nutrição</title><style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#173044;background:#f3f7f9}*{box-sizing:border-box}body{margin:0}header{background:#10283b;color:white;padding:22px max(18px,calc((100vw - 980px)/2))}header h1{margin:0;font-size:25px}header small{color:#a8cbd2}nav{display:flex;gap:7px;overflow:auto;margin-top:18px}nav button{background:#24475a;color:white;white-space:nowrap}button,select{font:inherit}button{border:0;border-radius:12px;padding:11px 15px;cursor:pointer;font-weight:650}button.primary{background:#087e79;color:white}button.secondary{background:#e6eef1;color:#173044}button:disabled{opacity:.45}main{max-width:980px;margin:auto;padding:22px 16px 60px}.card{background:white;border:1px solid #e0e9ed;border-radius:18px;padding:21px;margin-bottom:16px;box-shadow:0 4px 20px #0b34400a}.muted{color:#637985}.pill{display:inline-block;background:#e5f5f0;color:#087e79;padding:5px 10px;border-radius:30px;font-size:12px;font-weight:700}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.space{justify-content:space-between}.option{display:block;text-align:left;width:100%;margin:9px 0;background:#f2f6f8;color:#183648;border:1px solid #dae5e8;font-weight:500}.option.correct{background:#d6f6e5;border-color:#39a775}.option.wrong{background:#ffe0e0;border-color:#d65e5e}.option.chosen{outline:2px solid #087e79}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.metric{background:#edf5f7;padding:15px;border-radius:14px}.metric b{font-size:25px;display:block}select{padding:10px;border-radius:10px;border:1px solid #ccdbe0;max-width:100%}.bar{height:9px;background:#e7eef0;border-radius:10px;overflow:hidden}.bar>div{height:100%;background:#087e79}.question{font-size:19px;line-height:1.5;font-weight:650}.note{padding:12px;border-radius:12px;background:#eef8f4;margin-top:12px}.warn{background:#fff5e6;padding:12px;border-radius:12px}h2{margin:0 0 12px}h3{margin:8px 0}.footer{margin-top:22px;color:#637985;font-size:12px}@media(max-width:600px){header{padding:20px 16px}.card{padding:16px}.question{font-size:17px}}
button.option{pointer-events:auto!important;opacity:1!important;cursor:pointer!important}button.option:disabled{pointer-events:auto!important;opacity:1!important}</style></head><body><header><h1>✦ Concurso Prep</h1><small>Nutricionista · Hospital Odilon Behrens · IBGP</small><nav id="nav"></nav></header><main id="app"></main><script>
const Q=[{"id":"cp-001","area":"Português","topic":"Interpretação","text":"Em um texto argumentativo, a tese corresponde:","options":["Ao argumento secundário","À posição central defendida pelo autor","À conclusão obrigatoriamente estatística","À citação de outra obra"],"answer":1,"explanation":"A tese é o posicionamento principal que o texto busca sustentar.","origin":"Inédita · treino"},{"id":"cp-002","area":"Português","topic":"Concordância","text":"Assinale a alternativa com concordância verbal adequada:","options":["Fazem três anos que a unidade abriu.","Houveram mudanças no protocolo.","Existem novos procedimentos.","Deve haverem profissionais disponíveis."],"answer":2,"explanation":"O verbo existir concorda com o sujeito plural: existem novos procedimentos.","origin":"Inédita · treino"},{"id":"cp-003","area":"Português","topic":"Crase","text":"Assinale a frase com emprego correto da crase:","options":["O relatório foi entregue à diretora.","A equipe chegou à pé.","O paciente foi atendido à partir das oito.","O documento foi enviado à todos."],"answer":0,"explanation":"Há fusão da preposição a com o artigo feminino a em 'à diretora'.","origin":"Inédita · treino"},{"id":"cp-004","area":"Português","topic":"Coesão","text":"Em 'O atendimento foi ampliado; portanto, a espera diminuiu', o conectivo indica:","options":["Oposição","Conclusão","Alternância","Condição"],"answer":1,"explanation":"'Portanto' introduz uma conclusão.","origin":"Inédita · treino"},{"id":"cp-005","area":"Português","topic":"Pontuação","text":"Qual alternativa apresenta pontuação adequada?","options":["Os profissionais, realizaram a triagem.","Durante a manhã, a equipe revisou os prontuários.","A equipe revisou, os prontuários.","Os pacientes que chegaram, foram atendidos."],"answer":1,"explanation":"O adjunto adverbial deslocado pode ser separado por vírgula.","origin":"Inédita · treino"},{"id":"cp-006","area":"Políticas de Saúde Pública","topic":"SUS","text":"O princípio do SUS que garante acesso aos serviços de saúde a todas as pessoas é:","options":["Integralidade","Equidade","Universalidade","Regionalização"],"answer":2,"explanation":"Universalidade significa acesso à saúde para todos.","origin":"Inédita · treino"},{"id":"cp-007","area":"Políticas de Saúde Pública","topic":"Lei 8.142/1990","text":"Segundo a Lei 8.142/1990, a Conferência de Saúde reúne-se ordinariamente a cada:","options":["Um ano","Dois anos","Quatro anos","Cinco anos"],"answer":2,"explanation":"A lei prevê reunião a cada quatro anos, sem prejuízo de convocação extraordinária.","origin":"Inédita · treino"},{"id":"cp-008","area":"Políticas de Saúde Pública","topic":"Epidemiologia","text":"Incidência é a medida de:","options":["Todos os casos existentes em um momento","Casos novos em uma população e período","Óbitos por todas as causas","Pessoas hospitalizadas em uma data"],"answer":1,"explanation":"Incidência se refere a casos novos em população sob risco ao longo de um período.","origin":"Inédita · treino"},{"id":"cp-009","area":"Políticas de Saúde Pública","topic":"Constituição","text":"Segundo o art. 196 da Constituição, a saúde é:","options":["Direito de todos e dever do Estado","Benefício exclusivo de trabalhadores formais","Serviço apenas municipal","Responsabilidade apenas individual"],"answer":0,"explanation":"O artigo 196 estabelece saúde como direito de todos e dever do Estado.","origin":"Inédita · treino"},{"id":"cp-010","area":"Políticas de Saúde Pública","topic":"Vigilância","text":"O SINAN é utilizado principalmente para:","options":["Registrar nascimentos","Registrar agravos de notificação","Controlar estoques hospitalares","Gerenciar escalas"],"answer":1,"explanation":"O SINAN reúne informações sobre agravos de notificação.","origin":"Inédita · treino"},{"id":"cp-011","area":"Conhecimentos Específicos","topic":"Avaliação nutricional","text":"A triagem nutricional tem como objetivo principal:","options":["Estabelecer diagnóstico definitivo de todas as doenças","Identificar precocemente risco nutricional","Substituir a avaliação nutricional completa","Definir automaticamente a via parenteral"],"answer":1,"explanation":"A triagem identifica pacientes em risco que precisam de avaliação mais aprofundada.","origin":"Inédita · treino"},{"id":"cp-012","area":"Conhecimentos Específicos","topic":"Terapia enteral","text":"Em paciente com trato gastrointestinal funcional, quando a alimentação oral não atende às necessidades, geralmente se prefere:","options":["Nutrição parenteral total","Nutrição enteral quando indicada","Jejum prolongado","Somente hidratação venosa"],"answer":1,"explanation":"A via enteral costuma ser preferida quando o trato gastrointestinal está funcional e há indicação clínica.","origin":"Inédita · treino"},{"id":"cp-013","area":"Conhecimentos Específicos","topic":"Terapia parenteral","text":"A nutrição parenteral administra nutrientes:","options":["Diretamente no trato gastrointestinal","Por via intravenosa","Somente por via oral","Através de sonda nasogástrica"],"answer":1,"explanation":"Nutrição parenteral utiliza acesso venoso.","origin":"Inédita · treino"},{"id":"cp-014","area":"Conhecimentos Específicos","topic":"Diabetes mellitus","text":"O planejamento alimentar para diabetes deve priorizar:","options":["Exclusão obrigatória de todos os carboidratos","Individualização e qualidade da alimentação","Consumo irrestrito de açúcar","Jejum obrigatório para todos"],"answer":1,"explanation":"A conduta é individualizada e considera necessidades, preferências e controle metabólico.","origin":"Inédita · treino"},{"id":"cp-015","area":"Conhecimentos Específicos","topic":"Doença renal","text":"Em doença renal crônica, a prescrição proteica deve considerar:","options":["Somente a idade","Estágio da doença e modalidade de tratamento","Somente o peso ao nascer","Uma quantidade fixa para todos"],"answer":1,"explanation":"A necessidade proteica depende do contexto clínico e da terapia renal.","origin":"Inédita · treino"},{"id":"cp-016","area":"Conhecimentos Específicos","topic":"Antropometria","text":"O IMC é calculado por:","options":["Peso (kg) dividido pela altura (m) ao quadrado","Altura dividida pelo peso","Peso multiplicado pela altura","Circunferência abdominal dividida pelo peso"],"answer":0,"explanation":"IMC = peso em kg / altura em metros ao quadrado.","origin":"Inédita · treino"},{"id":"cp-017","area":"Conhecimentos Específicos","topic":"Paciente crítico","text":"Na UTI, a escolha e progressão da terapia nutricional devem considerar:","options":["Apenas a preferência do profissional","Estabilidade clínica e tolerância","Somente o horário das refeições","Uma fórmula igual para todos"],"answer":1,"explanation":"A avaliação clínica e a tolerância orientam o início e a progressão.","origin":"Inédita · treino"},{"id":"cp-018","area":"Conhecimentos Específicos","topic":"Ética profissional","text":"O sigilo sobre informações obtidas no atendimento nutricional é:","options":["Facultativo em qualquer circunstância","Dever profissional, observadas as exceções legais e éticas","Exigido apenas em consultas privadas","Dispensável quando o paciente está internado"],"answer":1,"explanation":"O sigilo integra os deveres éticos, ressalvadas hipóteses legalmente previstas.","origin":"Inédita · treino"},{"id":"cp-019","area":"Conhecimentos Específicos","topic":"PNAN","text":"A Política Nacional de Alimentação e Nutrição integra as políticas do:","options":["Sistema Único de Saúde","Sistema Nacional de Trânsito","Sistema Judiciário","Sistema Financeiro"],"answer":0,"explanation":"A PNAN integra o conjunto de políticas públicas de saúde no SUS.","origin":"Inédita · treino"},{"id":"cp-020","area":"Conhecimentos Específicos","topic":"Digestão","text":"A maior parte da absorção de nutrientes ocorre no:","options":["Esôfago","Intestino delgado","Intestino grosso","Estômago"],"answer":1,"explanation":"O intestino delgado é o principal local de absorção de nutrientes.","origin":"Inédita · treino"},{"id":"cp-021","area":"Conhecimentos Específicos","topic":"Queimaduras","text":"Pacientes com queimaduras extensas frequentemente apresentam:","options":["Redução obrigatória do gasto energético","Resposta hipermetabólica","Ausência de catabolismo","Necessidade nula de proteínas"],"answer":1,"explanation":"Queimaduras extensas podem provocar resposta inflamatória e hipermetabolismo.","origin":"Inédita · treino"},{"id":"cp-022","area":"Conhecimentos Específicos","topic":"Pré-operatório","text":"A avaliação nutricional pré-operatória busca, entre outros objetivos:","options":["Identificar risco nutricional e orientar conduta","Eliminar qualquer necessidade de acompanhamento","Substituir avaliação médica","Garantir jejum por vários dias"],"answer":0,"explanation":"Identificar desnutrição ou risco nutricional ajuda a planejar o cuidado perioperatório.","origin":"Inédita · treino"},{"id":"cp-023","area":"Conhecimentos Específicos","topic":"Micronutrientes","text":"A vitamina B12 está especialmente relacionada à:","options":["Formação de células sanguíneas e função neurológica","Síntese exclusiva de vitamina C","Produção de bile","Digestão mecânica"],"answer":0,"explanation":"A vitamina B12 participa da hematopoiese e da manutenção neurológica.","origin":"Inédita · treino"},{"id":"cp-024","area":"Conhecimentos Específicos","topic":"Câncer","text":"No cuidado nutricional oncológico, uma prioridade é:","options":["Monitorar ingestão e alterações de peso","Prescrever a mesma dieta para todos","Ignorar sintomas gastrointestinais","Suspender automaticamente alimentação oral"],"answer":0,"explanation":"Monitorar ingestão, sintomas e estado nutricional permite individualizar intervenções.","origin":"Inédita · treino"},{"id":"cp-025","area":"Conhecimentos Específicos","topic":"Doenças hepáticas","text":"Em hepatopatias, a avaliação nutricional deve considerar:","options":["Somente o IMC isolado","Possível presença de ascite e edema","Apenas a altura","A ausência de alterações metabólicas"],"answer":1,"explanation":"Ascite e edema podem distorcer medidas baseadas em peso corporal.","origin":"Inédita · treino"}];
const areas=["Português","Conhecimentos Específicos","Políticas de Saúde Pública"];const targets=[10,30,10];const KEY="concurso-prep-v1";let state;try{state=JSON.parse(localStorage.getItem(KEY))||{}}catch{state={}};state.answers??={};state.currentChoices??={};state.favorites??=[];state.history??=[];state.flashIndex??=0;state.bankIndex??=0;let tab="home",filter="Todas",mode="bank",exam=null,flashFlipped=false;
const app=document.getElementById("app"),nav=document.getElementById("nav");function save(){localStorage.setItem(KEY,JSON.stringify(state))}function pct(a,b){return b?Math.round(a/b*100):0}function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function btn(label,fn,cl="secondary"){return '<button class="'+cl+'" onclick="'+fn+'">'+label+'</button>'}function change(t){tab=t;render()}function render(){nav.innerHTML=[["home","Início"],["bank","Questões"],["exam","Simulados"],["flash","Flashcards"],["stats","Estatísticas"],["review","Revisão"]].map(([id,n])=>btn(n,"change('"+id+"')",tab===id?"primary":"")).join("");if(tab==="home")home();if(tab==="bank")bank();if(tab==="exam")examPage();if(tab==="flash")flash();if(tab==="stats")stats();if(tab==="review")review()}
function home(){const n=Object.keys(state.answers).length,correct=Q.filter(q=>state.answers[q.id]===q.answer).length;app.innerHTML='<div class="card"><span class="pill">Edital 01/2026 · Cargo 508</span><h2 style="margin-top:12px">Seu espaço de preparação</h2><p class="muted">Questões, simulados de 3 horas e revisão personalizada. Seu progresso fica salvo neste navegador.</p><div class="grid"><div class="metric"><b>'+Q.length+'</b>questões iniciais</div><div class="metric"><b>'+n+'</b>respondidas</div><div class="metric"><b>'+pct(correct,n)+'%</b>acertos no banco</div><div class="metric"><b>'+state.history.length+'</b>simulados concluídos</div></div><p class="warn">Versão piloto: '+Q.length+' questões inéditas revisáveis. Meta de expansão: 150 (30 Português, 90 Nutrição, 30 Políticas). As questões ainda não representam uma prova oficial.</p><div class="row">'+btn("Continuar questões","change('bank')","primary")+btn("Iniciar simulado","change('exam')")+'</div></div>'}
function list(){return Q.filter(q=>filter==="Todas"||q.area===filter)}function bank(){const arr=list();let i=Math.min(state.bankIndex,arr.length-1);if(i<0)i=0;const q=arr[i];app.innerHTML='<div class="card"><h2>Banco de questões</h2><div class="row"><label>Disciplina <select onchange="filter=this.value;state.bankIndex=0;save();bank()">'+["Todas",...areas].map(a=>'<option '+(a===filter?'selected':'')+'>'+a+'</option>').join("")+'</select></label><span class="muted">'+(i+1)+' / '+arr.length+'</span></div></div>'+question(q,"bank")+'<div class="row">'+btn("← Anterior","moveBank(-1)")+btn("Próxima →","moveBank(1)","primary")+'</div>'}
function question(q,context){if(!q)return '<div class="card">Nenhuma questão encontrada.</div>';const answer=context==="exam"?exam.answers[q.id]:(state.currentChoices[q.id]??state.answers[q.id]);const show=context!=="exam"&&answer!==undefined;return '<div class="card"><div class="row space"><span class="pill">'+esc(q.area)+'</span><div class="row"><small class="muted">'+esc(q.topic)+' · '+esc(q.origin)+'</small>'+(context==='bank'?btn(state.favorites.includes(q.id)?'★':'☆',"favorite('"+q.id+"')"):'')+'</div></div><p class="question">'+esc(q.text)+'</p>'+q.options.map((o,j)=>'<button class="option '+(show&&j===q.answer?"correct":"")+' '+(show&&j===answer&&j!==q.answer?"wrong":"")+' '+(answer===j?"chosen":"")+'" '+''+' onclick="choose(\''+q.id+'\','+j+',\''+context+'\')">'+String.fromCharCode(65+j)+') '+esc(o)+'</button>').join("")+(show?'<div class="note"><b>'+(answer===q.answer?'✓ Correto':'✕ Incorreto')+'</b><p>'+esc(q.explanation)+'</p><small>Gabarito: '+String.fromCharCode(65+q.answer)+'</small></div>':'')+'</div>'}
function choose(id,j,context){if(context==="exam"){exam.answers[id]=j;examPage();return}if(state.answers[id]===undefined)state.answers[id]=j;state.currentChoices[id]=j;save();if(context==='bank')bank();else render()}function moveBank(n){const arr=list();state.bankIndex=Math.max(0,Math.min(arr.length-1,state.bankIndex+n));save();bank()}function favorite(id){state.favorites=state.favorites.includes(id)?state.favorites.filter(x=>x!==id):[...state.favorites,id];save();render()}
function buildExam(){if(areas.some((a,i)=>Q.filter(q=>q.area===a).length<targets[i])){alert("O simulado completo será liberado quando houver 50 questões distintas nas proporções do edital.");return}const chosen=[];areas.forEach((a,i)=>{const pool=Q.filter(q=>q.area===a).sort(()=>Math.random()-.5);for(let j=0;j<targets[i];j++)chosen.push(pool[j].id)});exam={ids:chosen,answers:{},index:0,end:Date.now()+10800000};examPage()}function examPage(){if(!exam){app.innerHTML='<div class="card"><h2>Simulado completo</h2><p>50 questões · 3 horas · 2 pontos por acerto · mínimo de 60 pontos.</p><p class="warn">Piloto: o banco ainda não contém 50 questões distintas. Para não repetir questões dentro do simulado, o início ficará disponível após a ampliação do banco.</p>'+btn("Iniciar simulado", "buildExam()", "primary")+'</div>';return}if(Date.now()>=exam.end){finishExam();return}const q=Q.find(x=>x.id===exam.ids[exam.index]);const rem=Math.max(0,exam.end-Date.now());const hh=String(Math.floor(rem/3600000)).padStart(2,"0"),mm=String(Math.floor(rem/60000)%60).padStart(2,"0"),ss=String(Math.floor(rem/1000)%60).padStart(2,"0");app.innerHTML='<div class="card"><div class="row space"><b>Questão '+(exam.index+1)+' de 50</b><b id="clock">'+hh+':'+mm+':'+ss+'</b></div><p class="muted">'+Object.keys(exam.answers).length+' respostas registradas</p></div>'+question(q,"exam")+'<div class="row">'+btn("← Anterior","examMove(-1)")+btn("Próxima →","examMove(1)","primary")+btn("Finalizar simulado","finishExam()")+'</div>';clearInterval(window.clockTimer);window.clockTimer=setInterval(()=>{if(tab!=="exam"||!exam){clearInterval(window.clockTimer);return}const d=exam.end-Date.now();if(d<=0){clearInterval(window.clockTimer);finishExam();return}const el=document.getElementById("clock");if(el)el.textContent=[Math.floor(d/3600000),Math.floor(d/60000)%60,Math.floor(d/1000)%60].map(x=>String(x).padStart(2,"0")).join(":")},1000)}function examMove(n){exam.index=Math.max(0,Math.min(49,exam.index+n));examPage()}function finishExam(){if(!exam)return;const score=exam.ids.reduce((sum,id)=>sum+(exam.answers[id]===Q.find(q=>q.id===id).answer?2:0),0);state.history.unshift({date:new Date().toLocaleString("pt-BR"),score,answered:Object.keys(exam.answers).length,byArea:areas.map(a=>{const ids=exam.ids.filter(id=>Q.find(q=>q.id===id).area===a);return ids.filter(id=>exam.answers[id]===Q.find(q=>q.id===id).answer).length})});save();exam=null;clearInterval(window.clockTimer);app.innerHTML='<div class="card"><h2>Resultado do simulado</h2><h1>'+score+' / 100 pontos</h1><p>'+(score>=60?'Meta de 60 pontos atingida':'Abaixo da meta de 60 pontos')+'</p>'+btn("Ver estatísticas","change('stats')","primary")+'</div>'}
function flash(){const q=Q[state.flashIndex%Q.length];app.innerHTML='<div class="card"><h2>Flashcards</h2><p class="muted">Cartão '+(state.flashIndex+1)+' de '+Q.length+' · '+esc(q.area)+'</p><div class="card" style="min-height:180px;background:#eaf5f3"><p class="question">'+(flashFlipped?esc(q.options[q.answer])+' — '+esc(q.explanation):esc(q.text))+'</p></div><div class="row">'+btn(flashFlipped?"Mostrar frente":"Virar cartão","flashFlipped=!flashFlipped;flash()","primary")+btn("←","moveFlash(-1)")+btn("→","moveFlash(1)")+'</div></div>'}function moveFlash(n){state.flashIndex=(state.flashIndex+n+Q.length)%Q.length;flashFlipped=false;save();flash()}
function stats(){const n=Object.keys(state.answers).length,correct=Q.filter(q=>state.answers[q.id]===q.answer).length;app.innerHTML='<div class="card"><h2>Desempenho por disciplina</h2><p class="muted">'+n+' respondidas · '+correct+' acertos</p>'+areas.map(a=>{const qs=Q.filter(q=>q.area===a),done=qs.filter(q=>state.answers[q.id]!==undefined),right=done.filter(q=>state.answers[q.id]===q.answer).length;return '<div style="margin:22px 0"><div class="row space"><b>'+a+'</b><b>'+pct(right,done.length)+'%</b></div><div class="bar"><div style="width:'+pct(right,done.length)+'%"></div></div><small class="muted">'+right+' acertos em '+done.length+' respondidas · '+qs.length+' disponíveis</small></div>'}).join("")+'</div><div class="card"><h2>Histórico de simulados</h2>'+(state.history.length?state.history.map(h=>'<p>'+h.date+' — <b>'+h.score+'/100</b> · Português '+h.byArea[0]+'/10 · Nutrição '+h.byArea[1]+'/30 · Políticas '+h.byArea[2]+'/10</p>').join(""):'<p class="muted">Nenhum simulado concluído.</p>')+'</div>'}
function review(){const wrong=Q.filter(q=>state.answers[q.id]!==undefined&&state.answers[q.id]!==q.answer),fav=Q.filter(q=>state.favorites.includes(q.id));app.innerHTML='<div class="card"><h2>Revisão</h2><p class="muted">Questões erradas ('+wrong.length+') e favoritas ('+fav.length+')</p>'+[["Erradas",wrong],["Favoritas",fav]].map(([label,arr])=>'<h3>'+label+'</h3>'+(arr.length?arr.map(q=>'<div class="metric" style="margin:8px 0"><b style="font-size:14px">'+esc(q.text)+'</b><p>'+esc(q.explanation)+'</p></div>').join(""):'<p class="muted">Nenhuma questão ainda.</p>')).join("")+'</div>'}
render();</script><!-- build 0.1.2 answer-change fix --></body></html>
